[package]
name = "pulse"
version = "0.1.0"
edition = "2024"
description = "Central event journal for the vascular agent stack"
license = "MIT"
publish = false

# Every dependency must also be baked into the verifier image (it has no
# network): add one here, then rebuild heart-agent:vascular before any task
# that needs it runs.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# P3, the collector: ids for id-less legacy lines (uuid v5), the blocking
# Postgres client (no async runtime of our own), and artifact intake (verify
# a blob's sha256 name, store it zstd-compressed)
postgres = { version = "0.19", features = ["with-serde_json-1", "with-uuid-1"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v5", "serde"] }
zstd = "0.13"
